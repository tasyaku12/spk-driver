# Blueprint Render — layanan gratis. Tidak mengubah kode aplikasi Laravel.
# Deploy: Dashboard Render → New → Blueprint → pilih repo ini.
services:
  - type: web
    name: spk-driver
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: SPK Driver
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: error
      - key: APP_URL
        sync: false
